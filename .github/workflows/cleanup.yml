name: Cleanup Repo

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 删除冗余文件
        run: |
          shopt -s dotglob
          for f in *; do
            case "$f" in
              .git|.github|ip_list.txt|merge_shards.py|scanner.py)
                echo "✅ 保留: $f"
                ;;
              *)
                echo "🗑️ 删除: $f"
                rm -rf "$f"
                ;;
            esac
          done
          shopt -u dotglob
          echo "--- 删除后根目录 ---"
          ls -la

      - name: 提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet && echo "无变化" || git commit -m "清理冗余文件 [skip ci]"
          success=false
          for i in $(seq 1 3); do
            if git pull origin main --rebase && git push; then
              success=true; break
            fi
            WAIT=$((RANDOM % 21 + 10))
            sleep $WAIT
          done
          [ "$success" = "true" ] || exit 1
