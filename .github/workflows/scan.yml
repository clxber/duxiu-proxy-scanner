  merge:
    needs: [health-check, shard-0, shard-1, shard-2, shard-3, shard-4, shard-5, shard-6, shard-7]
    if: always() && needs.health-check.outputs.should_run == 'true'
    runs-on: ubuntu-26.04
    permissions:
