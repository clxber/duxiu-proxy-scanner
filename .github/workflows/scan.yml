  merge:
    needs: [shard-0, shard-1, shard-2, shard-3, shard-4, shard-5, shard-6, shard-7]
    if: always()
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin main --rebase

      - name: 下载 shard-0 artifact
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: shard-0-files
          path: artifacts
          merge-multiple: true
      - name: 下载 shard-1 artifact
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: shard-1-files
          path: artifacts
          merge-multiple: true
      - name: 下载 shard-2 artifact
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v7
