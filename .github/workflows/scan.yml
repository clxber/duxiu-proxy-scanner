          name: shard-5-files
          path: artifacts
          merge-multiple: true
      - name: 下载 shard-6 artifact
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: shard-6-files
          path: artifacts
          merge-multiple: true
      - name: 下载 shard-7 artifact
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: shard-7-files
          path: artifacts
          merge-multiple: true

      - name: 从 Artifact 恢复缺失文件
        if: always()
        run: |
          if [ -d artifacts ]; then
            count=0
            for f in artifacts/*; do
              [ -f "$f" ] || continue
              base=$(basename "$f")
              if [ ! -f "$base" ]; then
                cp "$f" "$base"
                echo "从 artifact 恢复: $base"
                count=$((count+1))
              fi
            done
            echo "共从 artifact 恢复 $count 个文件"
          else
            echo "无 artifact 目录，跳过"
          fi

      - name: 合并结果
        run: python merge_shards.py

      - name: 提交
        if: always()
        run: |
          git add -A
          git diff --staged --quiet || git commit -m "合并 [skip ci]"
          git stash -u 2>/dev/null || true
          success=false
          for i in $(seq 1 10); do
            if git pull origin main --rebase && git push; then
              success=true; break
            fi
            git rebase --abort 2>/dev/null || true
            WAIT=$((RANDOM % 26 + 5))
            echo "重试 $i/10，等待 ${WAIT}s"
            sleep $WAIT
          done
          [ "$success" = "true" ] || exit 1

      - name: 触发下一轮（仅当需要续跑时）
        if: always()
        run: |
          FLAG="$RUNNER_TEMP/trigger.flag"
          if [ ! -f "$FLAG" ]; then
            echo "无 flag，跳过"
            exit 0
          fi
          value=$(cat "$FLAG")
          if [ "$value" = "yes" ]; then
            echo "🔄 触发下一轮 workflow"
            gh workflow run scan.yml --ref main
          else
            echo "✅ 结束，等待手动触发"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 上传最终 Artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: working-proxies-${{ github.run_id }}
          path: |
            working_proxies.txt
            phase.json
            alive_ip_ranges.txt
