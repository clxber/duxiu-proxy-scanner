        if: always()
        run: |
          # ★ 北京时间禁止时段检查（双保险）
          BJ_HOUR=$(TZ='Asia/Shanghai' date +%H)
          if [ "$BJ_HOUR" -ge 0 ] && [ "$BJ_HOUR" -lt 8 ]; then
            echo "🛑 北京时间 ${BJ_HOUR} 点，处于禁止时段（0:00-8:00），跳过触发"
            exit 0
          fi

          FLAG="$RUNNER_TEMP/trigger.flag"
          if [ ! -f "$FLAG" ]; then
            echo "无 flag，跳过"
            exit 0
          fi
          value=$(cat "$FLAG")
          if [ "$value" = "yes" ]; then
            echo "🔄 触发下一轮 workflow"
            gh workflow run scan.yml --ref main
          else
            echo "✅ 结束，等待手动触发"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: 上传 Artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: working-proxies-${{ github.run_id }}
          path: |
            working_proxies.txt
            phase.json
