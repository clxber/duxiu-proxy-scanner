name: Scan Proxies

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: proxy-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-26.04
    timeout-minutes: 358

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - run: pip install requests requests[socks]

      - name: 配置 git 身份
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 拉取最新代码
        run: git pull origin main --rebase

      - name: 运行扫描
        env:
          MAX_RUNTIME_SEC: '20880'
        run: python scanner.py

      - name: 提交结果
        if: always()
        run: |
          git add -A
          git diff --staged --quiet || git commit -m "扫描进度 [skip ci]"
          success=false
          for i in $(seq 1 3); do
            if git pull origin main --rebase && git push; then
              success=true
              break
            fi
            WAIT=$((RANDOM % 21 + 10))
            echo "推送失败，等待 ${WAIT} 秒后重试（第 $i / 3 次）..."
            sleep $WAIT
          done
          if [ "$success" = "false" ]; then
            echo "❌ 推送连续失败 3 次，退出。"
            exit 1
          fi

      - name: 自动续跑（仅当被截断时）
        if: always()
        run: |
          FLAG="$RUNNER_TEMP/continue.flag"
          if [ ! -f "$FLAG" ]; then
            echo "未找到 flag 文件，跳过自动续跑"
            exit 0
          fi
          value=$(cat "$FLAG")
          echo "flag = $value"
          if [ "$value" = "continue" ]; then
            echo "🔄 本轮被截断，自动触发下一次 workflow（无缝续跑）"
            gh workflow run scan.yml --ref main
          elif [ "$value" = "done" ]; then
            echo "✅ 一轮扫描完成，停止。等待手动触发下一轮。"
          else
            echo "未知 flag 值：$value，跳过"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 上传 Artifact（备选）
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: working-proxies-${{ github.run_id }}
          path: |
            working_proxies.txt
            progress.json
