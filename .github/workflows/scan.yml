name: Scan Proxies

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'   # UTC 0:00 = 北京 8:00

permissions:
  contents: write
  actions: write

concurrency:
  group: proxy-scan
  cancel-in-progress: false

jobs:
  health-check:
    runs-on: ubuntu-26.04
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: 检查是否需要运行
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "🟢 手动触发，放行"
            echo "should_run=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # schedule 触发：检查是否有未完成的任务
          if [ ! -f "phase.json" ]; then
            echo "⏸️ 无 phase.json，跳过（没有进行中的任务）"
            echo "should_run=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          has_pending=false
          for f in progress_shard*.json; do
            if [ -f "$f" ]; then
              completed=$(python3 -c "import json; print(json.load(open('$f')).get('completed', False))" 2>/dev/null || echo "True")
              echo "  $f: completed=$completed"
              if [ "$completed" = "False" ]; then
                has_pending=true
                break
              fi
            fi
          done

          if [ "$has_pending" = "true" ]; then
            echo "🟢 有待续跑任务，放行"
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            echo "⏸️ 无待续跑任务，跳过"
            echo "should_run=false" >> $GITHUB_OUTPUT
          fi

  shard-0:
    needs: health-check
    if: needs.health-check.outputs.should_run == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install requests requests[socks]
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin main --rebase
      - name: 运行扫描 分片0
        env:
          MAX_RUNTIME_SEC: '20880'
        run: python scanner.py --shard 0 --shard-total 8
      - name: 提交
        if: always()
        run: |
          git add -A
          git diff --staged --quiet || git commit -m "分片0 [skip ci]"
          success=false
          for i in $(seq 1 3); do
            if git pull origin main --rebase && git push; then
              success=true; break
            fi
            WAIT=$((RANDOM % 21 + 10))
            sleep $WAIT
          done
          [ "$success" = "true" ] || exit 1

