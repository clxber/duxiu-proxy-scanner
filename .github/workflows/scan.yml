  merge:
    needs: [shard-0, shard-1, shard-2, shard-3, shard-4, shard-5, shard-6, shard-7]
    if: always()
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin main --rebase
      - name: 合并结果
        run: python merge_shards.py
      - name: 提交
        if: always()
        run: |
          git add -A
          git diff --staged --quiet || git commit -m "合并 [skip ci]"
          success=false
          for i in $(seq 1 10); do
            if git pull origin main --rebase && git push; then
              success=true; break
            fi
            git rebase --abort 2>/dev/null || true
            WAIT=$((RANDOM % 26 + 5))
            echo "重试 $i/10，等待 ${WAIT}s"
            sleep $WAIT
          done
          [ "$success" = "true" ] || exit 1
      - name: 触发下一轮（仅当需要续跑时）
        if: always()
        run: |
          FLAG="$RUNNER_TEMP/trigger.flag"
          if [ ! -f "$FLAG" ]; then
            echo "无 flag，跳过"
            exit 0
          fi
          value=$(cat "$FLAG")
          if [ "$value" = "yes" ]; then
            echo "🔄 触发下一轮 workflow"
            gh workflow run scan.yml --ref main
          else
            echo "✅ 结束，等待手动触发"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: 上传 Artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: working-proxies-${{ github.run_id }}
          path: |
            working_proxies.txt
            phase.json
